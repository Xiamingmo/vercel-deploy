:root{--bg:#f5f7f8;--panel:#fff;--ink:#17212b;--muted:#7a8792;--line:#e8edf0;--green:#22a06b;--green-soft:#e7f6ef;--blue:#3977ef;--orange:#f29a3f;--shadow:0 8px 28px #25313d0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,textarea{font:inherit}button{border:0;cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:236px;background:#fff;border-right:1px solid var(--line);padding:28px 16px;position:fixed;inset:0 auto 0 0;z-index:3}.brand{font-size:20px;font-weight:700;padding:0 14px 30px;letter-spacing:.02em}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:4px}.nav{display:grid;gap:6px}.nav button{background:none;color:#65727d;text-align:left;padding:12px 14px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active{background:var(--green-soft);color:var(--green);font-weight:600}.nav .ico{font-size:18px;width:22px;text-align:center}.main{margin-left:236px;width:calc(100% - 236px);padding:34px clamp(20px,4vw,58px);max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px}.eyebrow{color:var(--muted);font-size:13px;margin:0 0 5px}.title{margin:0;font-size:30px;letter-spacing:-.03em}.today{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:9px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:var(--shadow)}.span-8{grid-column:span 8}.span-4{grid-column:span 4}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.section-title h2{font-size:16px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.progress{height:8px;background:#edf1f3;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .3s}.tasks{display:grid;gap:10px}.task{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f2f3}.task:last-child{border:0}.task input{accent-color:var(--green);width:17px;height:17px}.task.done label{text-decoration:line-through;color:#a0aab1}.task label{flex:1}.delete{color:#b4bdc3;background:none;font-size:17px}.add-row{display:flex;gap:8px;margin-top:14px}.add-row input,.book input,.book textarea,.idea textarea{border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:0;width:100%;background:#fbfcfc}.add-row input:focus,.book input:focus,.idea textarea:focus{border-color:#a9d7c0}.btn{border-radius:8px;padding:10px 15px;background:var(--ink);color:white;font-weight:600}.btn.green{background:var(--green)}.btn.ghost{background:#f1f4f5;color:#55636e}.video{display:grid;grid-template-columns:110px 1fr auto;gap:15px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}.video:last-child{border:0}.thumb{height:74px;border-radius:8px;background:linear-gradient(135deg,#203b55,#77c5ac);display:grid;place-items:center;color:#fff;font-size:24px}.video h3{margin:0 0 5px;font-size:14px}.video p{color:var(--muted);font-size:12px;margin:0}.video a{white-space:nowrap;color:var(--blue);font-size:12px}.idea textarea{height:130px;resize:vertical}.idea-list{margin-top:20px;display:grid;gap:10px;max-height:300px;overflow:auto}.idea-item{border-left:3px solid var(--green);padding:8px 12px;background:#fafcfc;border-radius:0 8px 8px 0}.idea-item time{font-size:11px;color:var(--muted);display:block;margin-bottom:3px}.metric{font-size:28px;font-weight:700}.metric em{font-style:normal;font-size:14px;color:var(--muted);font-weight:400}.timer{text-align:center;padding:10px 0}.clock{font-size:52px;font-variant-numeric:tabular-nums;letter-spacing:.03em;margin:4px 0 12px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.circle{width:145px;height:145px;border-radius:50%;display:grid;place-items:center;margin:5px auto 15px;background:conic-gradient(var(--green) 0deg,var(--green) var(--deg),#edf1f3 var(--deg));position:relative}.circle:after{content:"";position:absolute;inset:10px;background:#fff;border-radius:50%}.circle b{position:relative;z-index:1;font-size:20px}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tag{border:1px solid var(--line);border-radius:20px;padding:7px 12px;color:var(--muted);background:white}.tag.selected{background:var(--green-soft);border-color:#bce8d1;color:var(--green)}.book{display:grid;gap:10px}.book label{font-size:12px;color:var(--muted)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.day{font-size:11px;color:var(--muted);padding:7px 0}.day b{display:grid;place-items:center;height:29px;width:29px;margin:4px auto;border-radius:50%;font-size:11px;color:#87939b;font-weight:500}.day.ok b{background:var(--green);color:#fff}.week-bars{display:flex;align-items:end;justify-content:space-between;height:130px;padding-top:12px}.bar-wrap{text-align:center;color:var(--muted);font-size:11px}.bar{width:22px;background:#d9e1e5;border-radius:5px 5px 2px 2px;margin:0 auto 7px;min-height:4px}.bar.today{background:var(--blue)}.fab{position:fixed;right:28px;bottom:28px;width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;font-size:21px;box-shadow:0 10px 25px #1c263033;z-index:4}.modal{position:fixed;inset:0;background:#16212b66;display:none;place-items:center;z-index:5;padding:20px}.modal.open{display:grid}.modal-box{background:white;border-radius:14px;padding:24px;width:min(420px,100%)}.modal-box h2{margin:0 0 18px}.overview-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.status{color:var(--green)}

.sidebar{background:#fbfcfc}.brand{letter-spacing:.04em}.nav button{transition:background .2s,color .2s,transform .2s}.nav button:hover{background:#f1f5f4;color:var(--green);transform:translateX(2px)}.nav button.active{box-shadow:inset 3px 0 var(--green)}.main{padding-top:40px}.topbar{position:relative}.topbar:after{content:'';position:absolute;left:0;bottom:-15px;width:42px;height:3px;border-radius:3px;background:var(--green)}.card{box-shadow:0 10px 30px rgba(23,33,43,.045);transition:box-shadow .2s,transform .2s}.card:hover{box-shadow:0 14px 34px rgba(23,33,43,.08)}.section-title h2{letter-spacing:.01em}.video{padding:17px 0}.video h3{font-size:15px}.video p b{color:var(--ink);font-weight:600}.thumb{background:linear-gradient(145deg,#184d43,#57b994 55%,#d7f0e5);box-shadow:inset 0 0 0 1px #ffffff38}.btn{transition:filter .2s,transform .2s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.tag{transition:all .2s}.tag:hover{border-color:#a9d7c0;color:var(--green)}.fab{transition:transform .2s,background .2s}.fab:hover{transform:scale(1.06);background:var(--green)}

<style id="mint-theme">html,body,.app,.main{background-color:#c9f3df !important;background-image:radial-gradient(#ffffff 1.5px,transparent 1.5px) !important;background-size:18px 18px !important}.sidebar{background-color:#b8ecd2 !important}.card,.modal-box{background-color:#ffffff !important}.title,.section-title h2{color:#db5b68 !important}</style><style id="purple-sidebar">.sidebar{background-color:#d8c4ee !important;border-right-color:#c5a9e5 !important}.sidebar .brand{color:#8b5fb8 !important}.sidebar .nav button{color:#6f5190 !important}.sidebar .nav button.active{background:#eadff7 !important;color:#7f4fa9 !important;box-shadow:inset 3px 0 #9a6ac2 !important}</style><style id="creator-layout-fix">.idea-item{overflow:visible !important;min-height:92px;padding:14px 16px !important}.idea-item>b{display:block;line-height:1.4;margin-top:3px}.idea-item>div{display:block !important;margin-top:10px !important}.idea-item .btn{display:inline-block !important;position:static !important;white-space:nowrap !important}.idea-list{overflow:visible !important;max-height:none !important}.card{overflow:visible !important}</style><body><div class="app"><aside class="sidebar"><div class="brand">茗寞工作台<small>Personal cockpit</small></div><nav class="nav" id="nav"></nav><button id="navSort" class="sort-settings">☷ 排序设置</button></aside><main class="main"><div class="topbar"><div><p class="eyebrow">欢迎回来，今天也保持专注</p><h1 class="title" id="pageTitle">每日计划</h1></div><div class="today" id="today"></div></div><section id="dailyQuote" class="card" style="margin-bottom:18px"></section><div id="content"></div></main></div><button class="fab" id="overviewBtn" title="今日总览">◌</button><div class="modal" id="modal"><div class="modal-box"><div class="section-title"><h2>今日总览</h2><button class="delete" id="closeModal">×</button></div><div id="overview"></div></div></div>

const KEY='personal-workbench-v1', todayKey=()=>new Date().toISOString().slice(0,10), fmt=d=>new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(d);let data=JSON.parse(localStorage.getItem(KEY)||'null')||{date:todayKey(),tasks:[],ideas:[],exercise:{seconds:0,done:false,days:[]},reading:{book:'',progress:''},english:{seconds:0,days:[],week:{}},news:{creators:[]}};if(!data.news)data.news={creators:[]};if(!data.english.channels)data.english.channels=[];if(!data.english.channels.some(x=>x.name==='175的小菜'))data.english.channels.push({id:17544068762273,name:'175的小菜',url:'https://www.douyin.com/search/175%E7%9A%84%E5%B0%8F%E8%8F%9C%2044068762273',platform:'抖音',type:'英语学习'});if(!data.english.channels.some(x=>x.name==='在AI路上的UU'))data.english.channels.push({id:9999939,name:'在AI路上的UU',url:'https://www.douyin.com/search/%E5%9C%A8AI%E8%B7%AF%E4%B8%8A%E7%9A%84UU%20yww9999939',platform:'抖音',type:'AI 学习'});if(data.date!==todayKey()){data.date=todayKey();data.tasks=[];data.exercise={seconds:0,done:false,days:data.exercise.days||[]};data.english={seconds:0,days:data.english.days||[],week:data.english.week||{}}}if(!data.tasks.length)data.tasks=['运动','阅读','英语学习','晚十点睡觉'].map((name,i)=>({id:Date.now()+i,name,done:false,fixed:true}));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));let page=0,exTimer=null,enTimer=null;const menus=[['✓','每日计划'],['📰','热点新闻'],['💡','灵感记录'],['🏋','锻炼身体'],['📖','每日阅读'],['A','英语学习'],['🤖','AI 学习'],['📸','拍照技巧和姿势'],['🧩','ai 课程'],['🧠','自我认知提升']];const nav=document.getElementById('nav');menus.forEach((m,i)=>{let b=document.createElement('button');b.innerHTML=`<span class="ico">${m[0]}</span><span>${m[1]}</span>`;b.onclick=()=>{page=i;render()};nav.appendChild(b)});document.getElementById('today').textContent=fmt(new Date());let collapseBtn=document.getElementById('collapseBtn');if(collapseBtn)collapseBtn.onclick=()=>{document.querySelector('.sidebar').classList.toggle('collapsed');document.querySelector('.main').classList.toggle('collapsed')};
function creatorModule(title, items){return `<section class="card"><div class="section-title"><h2>${title}</h2><span>${items.length} 位关注博主</span></div><p style="color:var(--muted)">点击博主名称进入对应学习内容。</p><div class="idea-list">${items.map(x=>{let link=x.url||('https://www.douyin.com/search/'+encodeURIComponent(x.name+' '+x.account));return `<div class="idea-item"><time>${x.platform||'抖音'} · ${x.account}</time><b>${x.name}</b><div style="margin-top:8px"><a class="btn green" href="${link}" target="_blank" rel="noopener">${x.url?'打开知识库 ↗':'打开学习 ↗'}</a></div></div>`}).join('')}</div></section>`}function render(){document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===page));document.getElementById('pageTitle').textContent=menus[page][1];let views=[plan,videos,ideas,exercise,reading,english];views.push(()=>creatorModule('AI 学习',[{name:'学姐教育AI（线上课）',account:'LLLCoral33'},{name:'路蔓蔓（AI局）',account:'34541129498'},{name:'老陈是小登老',account:'61745640356'},{name:'银泰AI实战',account:'60689175632'},{name:'Bob同学',account:'1838735889'},{name:'Rico 有三猫',account:'小红书',platform:'小红书',url:'https://my.feishu.cn/wiki/E6aZwGfuOiKyYBkoKwncxuyqn6W?from=from_copylink'},{name:'徐老师AI观察',account:'74263394377'},{name:'Claire',account:'19940508xx'},{name:'金校问李校',account:'57309518369'}]));views.push(()=>creatorModule('拍照技巧和姿势',[{name:'摄像师师（照片锐评）',account:'31414957562'},{name:'33比个耶',account:'93564443265'},{name:'淼淼不会拍照',account:'63694035546'},{name:'丁了个当',account:'699990168DD'},{name:'K教摄影',account:'syyy11123'}]));views.push(()=>creatorModule('ai 课程',[{name:'小鹅通 AIGC 学习课程',account:'小鹅通微信小程序',platform:'小鹅通微信小程序',url:'https://xiaoe-tech.com/'},{name:'小鹅通 Agent 开发与应用课程',account:'小鹅通微信小程序',platform:'小鹅通微信小程序',url:'https://xiaoe-tech.com/'}]));views.push(()=>creatorModule('自我认知提升',[{name:'稀稀舒展录',account:'21643386198'},{name:'灵魂调查员',account:'70810348857'},{name:'闲谈阔步',account:'37588760231'},{name:'星露花述',account:'1113345890'},{name:'财富认知差',account:'27415211460'},{name:'马哲的僵',account:'77319573812'},{name:'大女主成长笔记',account:'78369431086'},{name:'墨初微观',account:'33522517846'},{name:'逃逃逃不掉！',account:'62705418780'},{name:'金竹财智笔记',account:'czbj20260501'},{name:'麻辣奶糖',account:'MLNT111'},{name:'暗夜笔记',account:'89198205251'},{name:'小宇财经',account:'YCRX215'},{name:'黄大圣叨叨叨',account:'31978177452'},{name:'比奇堡观察局',account:'57395331252'},{name:'女神觉醒之路',account:'58262216780'},{name:'认知便利店M!',account:'117432260'},{name:'财经团子',account:'50267900267'},{name:'小林财读',account:'98662399949'},{name:'蟹老板保险柜',account:'78047825929'},{name:'比奇堡学院',account:'90463129757'}]));document.getElementById('content').innerHTML=views[page]();bind();save()}
function plan(){let done=data.tasks.filter(x=>x.done).length,p=Math.round(done/data.tasks.length*100);return `<div class="grid"><section class="card span-8"><div class="section-title"><h2>今日任务</h2><span>已完成 ${done}/${data.tasks.length} 项</span></div><div class="progress"><i style="width:${p}%"></i></div><div class="tasks" style="margin-top:15px">${data.tasks.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><label>${t.name}</label><button class="delete" data-del="${t.id}">×</button></div>`).join('')}</div><div class="add-row"><input id="newTask" placeholder="添加一个自定义任务"><button class="btn green" id="addTask">添加</button></div></section><section class="card span-4"><div class="section-title"><h2>今日状态</h2><span>${p}%</span></div><div class="metric">${done}<em> / ${data.tasks.length} 已完成</em></div><p style="color:var(--muted)">每天完成一点点，长期会看见变化。</p></section></div>`}
